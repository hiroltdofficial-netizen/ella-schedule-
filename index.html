<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>To do list for Ella♥</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#E8437A;--pink-light:#FCE8F0;--pink-mid:#F2799F;--pink-border:#F4B8CF;
  --sat:#2563EB;--sat-bg:#EFF6FF;--sat-border:#BFDBFE;
  --sun:#DC2626;--sun-bg:#FEF2F2;--sun-border:#FECACA;
  --bg:#FFF8FA;--card:#FFFFFF;--text:#1a1a2e;--text2:#6b7280;--text3:#9ca3af;
  --border:#f0e0e8;--radius:14px;--radius-sm:10px;
  --teal:#0F9B6E;--red:#DC2626;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;overflow-x:hidden}
body{padding-bottom:48px}

/* HEADER */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 14px 10px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(232,67,122,0.06)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.title-area{display:flex;align-items:center;gap:8px;cursor:pointer}
.profile-avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--pink-border);background:var(--pink-light);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;flex-shrink:0}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.app-title{font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;color:var(--pink)}
.header-actions{display:flex;align-items:center;gap:5px}
.mode-tabs{display:flex;background:#f3e8ef;border-radius:10px;padding:3px;gap:2px}
.mode-tab{padding:4px 10px;border-radius:7px;font-size:11px;font-weight:700;font-family:'Baloo 2',cursive;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all 0.15s}
.mode-tab.active{background:var(--pink);color:#fff}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--pink-border);background:var(--card);color:var(--pink);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.icon-btn.on{background:var(--red);border-color:var(--red);color:#fff}
.icon-btn:active{transform:scale(0.9)}
.nav-row{display:flex;align-items:center;justify-content:space-between}
.nav-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--pink-border);background:var(--card);color:var(--pink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all 0.12s}
.nav-btn:active{background:var(--pink-light);transform:scale(0.9)}
.nav-label{font-family:'Baloo 2',cursive;font-size:13px;font-weight:700;color:var(--text)}

/* BANNERS */
.week-banner{margin:8px 14px 0;padding:10px 14px;border-radius:var(--radius);background:linear-gradient(135deg,#FFF0F8,#EDE9FE);border:1.5px solid var(--pink-border);text-align:center;display:none;animation:fadeIn 0.5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.week-banner.show{display:block}
.banner-text{font-family:'Baloo 2',cursive;font-size:14px;font-weight:700;color:var(--pink)}
.edit-banner{margin:6px 14px 0;padding:7px 12px;border-radius:var(--radius-sm);background:#FEF2F2;border:1px solid #FECACA;display:none;align-items:center;gap:6px}
.edit-banner.show{display:flex}
.edit-banner-txt{font-size:11px;color:var(--red);font-weight:500}

/* PROGRESS */
.prog-wrap{margin:8px 14px 0;background:var(--card);border-radius:var(--radius-sm);padding:7px 12px;border:1px solid var(--border);display:flex;align-items:center;gap:10px}
.prog-label{font-size:11px;color:var(--text2);white-space:nowrap;font-weight:500}
.prog-track{flex:1;height:7px;border-radius:4px;background:#fce8f0;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;background:var(--pink);transition:width 0.4s cubic-bezier(.4,0,.2,1)}
.prog-pct{font-size:12px;font-weight:700;color:var(--pink);min-width:32px;text-align:right}

/* WEEK VIEW */
.week-wrap{padding:8px 14px 0}
.day-headers{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.dh{text-align:center;padding:5px 2px 4px;border-radius:var(--radius-sm);background:var(--card);border:1px solid var(--border)}
.dh .dn{font-family:'Baloo 2',cursive;font-size:12px;font-weight:700;color:var(--text);line-height:1}
.dh .dd{font-size:9px;color:var(--text3);margin-top:1px}
.dh.sat{background:var(--sat-bg);border-color:var(--sat-border)}.dh.sat .dn{color:var(--sat)}
.dh.sun{background:var(--sun-bg);border-color:var(--sun-border)}.dh.sun .dn{color:var(--sun)}
.dh.today{border:2px solid var(--pink);background:var(--pink-light)}.dh.today .dn{color:var(--pink)}.dh.today .dd{color:var(--pink-mid)}
.task-row-line{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.task-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 2px;border-radius:var(--radius-sm);background:var(--card);border:1px solid var(--border);min-height:54px;position:relative;cursor:pointer;transition:all 0.12s;user-select:none;-webkit-user-select:none}
.task-cell.empty{background:transparent;border-color:transparent;cursor:default}
.task-cell.checked{background:var(--pink-light);border-color:var(--pink-border)}
.cell-check{width:26px;height:26px;border-radius:7px;border:2px solid var(--pink-border);background:#fdf0f5;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.12s;pointer-events:none}
.task-cell.checked .cell-check{background:var(--pink);border-color:var(--pink)}
.check-mark{width:7px;height:12px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg) translate(-1px,-1px);opacity:0;transition:opacity 0.1s;pointer-events:none}
.task-cell.checked .check-mark{opacity:1}
.cell-name{font-size:8.5px;color:var(--text2);text-align:center;line-height:1.2;word-break:keep-all;font-weight:500;pointer-events:none}
.task-cell.checked .cell-name{color:var(--pink);font-weight:700}
.sticker-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.sticker-cell{min-height:52px;border-radius:var(--radius-sm);border:1.5px dashed var(--pink-border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:all 0.25s;overflow:hidden}
.sticker-cell.earned{border-style:solid;border-color:var(--pink);background:var(--pink-light);animation:zpop 0.45s cubic-bezier(.34,1.56,.64,1)}
@keyframes zpop{0%{transform:scale(0.5)}100%{transform:scale(1)}}
.s-bunny{width:32px;height:32px}
.s-txt{font-family:'Baloo 2',cursive;font-size:7px;font-weight:700;color:var(--pink);text-align:center;line-height:1.3}
.s-icon{font-size:20px;line-height:1}
.s-dot{width:10px;height:10px;border-radius:50%;border:1.5px dashed var(--pink-border)}

/* MONTH VIEW */
.month-wrap{padding:8px 14px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--text2);padding:3px 0 5px;font-family:'Baloo 2',cursive}
.cal-dow.s{color:var(--sat)}.cal-dow.u{color:var(--sun)}
.cal-cell{border-radius:10px;border:1px solid var(--border);background:var(--card);min-height:52px;padding:4px 3px 3px;display:flex;flex-direction:column}
.cal-cell.other{background:#fafafa;opacity:0.4}
.cal-cell.today-c{border:2px solid var(--pink)}
.cal-cell.earned-c{background:var(--pink-light);border-color:var(--pink)}
.cal-num{font-size:11px;font-weight:700;color:var(--text);line-height:1}
.cal-num.s{color:var(--sat)}.cal-num.u{color:var(--sun)}.cal-num.today-n{color:var(--pink)}
.cal-sticker{font-size:16px;text-align:center;margin-top:1px;line-height:1}
.cal-bunny{width:22px;height:22px;display:block;margin:1px auto 0}
.cal-bar-wrap{margin-top:auto;padding-top:2px}
.cal-bar{height:4px;border-radius:2px;background:#fce8f0;overflow:hidden}
.cal-bar-fill{height:100%;border-radius:2px;background:var(--pink)}
.cal-cnt{font-size:7px;color:var(--text3);text-align:right;margin-top:1px}

/* STATS */
.stats-section{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px;margin-bottom:10px}
.stats-title{font-family:'Baloo 2',cursive;font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stat-label{font-size:12px;color:var(--text2);min-width:80px;font-weight:500}
.stat-bar-wrap{flex:1}
.stat-bar{height:8px;border-radius:4px;background:#fce8f0;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:4px;background:var(--pink);transition:width 0.6s cubic-bezier(.4,0,.2,1)}
.stat-pct{font-size:11px;font-weight:700;color:var(--pink);min-width:30px;text-align:right}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg)}
.badge-item.unlocked{background:var(--pink-light);border-color:var(--pink-border)}
.badge-icon{font-size:24px;line-height:1}
.badge-name{font-size:9px;font-weight:700;color:var(--text2);text-align:center;line-height:1.2}
.badge-item.unlocked .badge-name{color:var(--pink)}
.badge-lock{font-size:9px;color:var(--text3)}
.month-chart{display:flex;align-items:flex-end;gap:3px;height:80px}
.month-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.month-bar-bg{flex:1;width:100%;border-radius:4px;background:#fce8f0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.month-bar-fill{width:100%;border-radius:4px;background:var(--pink)}
.month-bar-lbl{font-size:8px;color:var(--text3);text-align:center}
.level-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#FFF0F8,#EDE9FE);border:1px solid var(--pink-border)}
.level-icon{font-size:32px;line-height:1}
.level-info{flex:1}
.level-name{font-family:'Baloo 2',cursive;font-size:15px;font-weight:800;color:var(--pink)}
.level-sub{font-size:11px;color:var(--text2);margin-top:2px}
.level-prog{margin-top:6px;height:6px;border-radius:3px;background:#f4c0d1;overflow:hidden}
.level-prog-fill{height:100%;border-radius:3px;background:var(--pink)}

/* ADD PANELS */
.panels{padding:8px 14px 0;display:flex;flex-direction:column;gap:7px}
.panel{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:12px 13px}
.panel-title{font-family:'Baloo 2',cursive;font-size:13px;font-weight:700;color:var(--text);margin-bottom:9px;display:flex;align-items:center;gap:5px}
.inp{height:38px;width:100%;border-radius:var(--radius-sm);border:1.5px solid var(--border);padding:0 12px;font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);margin-bottom:7px;outline:none;transition:border-color 0.15s}
.inp:focus{border-color:var(--pink-mid)}
.day-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.dpill{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700;font-family:'Baloo 2',cursive;cursor:pointer;border:1.5px solid var(--pink-border);background:var(--card);color:var(--pink);transition:all 0.12s;user-select:none}
.dpill.sel{background:var(--pink);border-color:var(--pink);color:#fff}
.dpill:active{transform:scale(0.9)}
.btn-add{width:100%;height:41px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:700;font-family:'Baloo 2',cursive;cursor:pointer;transition:all 0.12s}
.btn-add:active{transform:scale(0.97)}
.btn-pink{background:var(--pink);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.date-inp{height:38px;width:100%;border-radius:var(--radius-sm);border:1.5px solid var(--border);padding:0 12px;font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);margin-bottom:7px;outline:none}

/* EDIT LIST (manage panel) */
.edit-list-section{margin-top:10px}
.edit-list-label{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.edit-task-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.edit-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);touch-action:none;user-select:none;-webkit-user-select:none}
.edit-row-name{flex:1;font-size:12px;font-weight:500;color:var(--text);line-height:1.2}
.edit-row-sub{font-size:10px;color:var(--text3);flex-shrink:0;margin-right:4px}
.edit-del{width:26px;height:26px;border-radius:50%;background:#FEE2E2;border:none;color:#DC2626;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.1s}
.edit-del:active{transform:scale(0.88);background:#FECACA}



/* THEME DRAWER */
.theme-drawer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px 32px;z-index:300;transform:translateY(100%);transition:transform 0.3s cubic-bezier(.4,0,.2,1);box-shadow:0 -4px 20px rgba(0,0,0,0.1)}
.theme-drawer.open{transform:translateY(0)}
.drawer-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 14px}
.drawer-title{font-family:'Baloo 2',cursive;font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.theme-swatch{padding:8px 4px;border-radius:10px;border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all 0.12px}
.theme-swatch.active{border-color:var(--text)}
.swatch-circle{width:32px;height:32px;border-radius:50%}
.swatch-name{font-size:10px;font-weight:600;color:var(--text2)}
.drawer-title2{font-family:'Baloo 2',cursive;font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px}
.profile-edit-row{display:flex;gap:8px;align-items:center}
.profile-upload{width:48px;height:48px;border-radius:50%;border:2px dashed var(--pink-border);background:var(--pink-light);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0}
.profile-name-inp{flex:1;height:38px;border-radius:var(--radius-sm);border:1.5px solid var(--border);padding:0 12px;font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);outline:none}
.save-profile-btn{height:38px;padding:0 14px;border-radius:var(--radius-sm);background:var(--pink);color:#fff;border:none;font-size:13px;font-weight:700;font-family:'Baloo 2',cursive;cursor:pointer}
#profileFileInput{display:none}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:299;display:none}
.drawer-overlay.show{display:block}

/* TOAST */
.toast-el{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(12px);background:#fff;border:2px solid var(--pink);border-radius:14px;padding:9px 16px;display:flex;align-items:center;gap:8px;z-index:9998;box-shadow:0 4px 16px rgba(0,0,0,0.12);opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap}
.toast-el.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* CONFETTI */
#confettiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}

/* FAB */
.fab-wrap{position:fixed;bottom:16px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:100}
.fab{width:44px;height:44px;border-radius:50%;border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,0.18);transition:all 0.15s}
.fab:active{transform:scale(0.9)}
.fab-pink{background:var(--pink)}
/* ── DAY + BUTTON ── */
.day-add-btn{width:100%;min-height:32px;border-radius:var(--radius-sm);border:1.5px dashed var(--pink-border);background:transparent;color:var(--pink-mid);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;margin-top:2px}
.day-add-btn:active{background:var(--pink-light);transform:scale(0.95)}

/* ── ADD TASK MODAL ── */
.add-task-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:2000;display:none;align-items:flex-end;justify-content:center}
.add-task-overlay.show{display:flex}
.add-task-box{background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px 36px;width:100%;max-width:480px}
.add-task-title{font-family:'Baloo 2',cursive;font-size:16px;font-weight:800;color:var(--text);margin-bottom:4px}
.add-task-sub{font-size:12px;color:var(--text2);margin-bottom:14px}
.add-task-inp{height:44px;width:100%;border-radius:var(--radius-sm);border:1.5px solid var(--border);padding:0 14px;font-size:14px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);outline:none;margin-bottom:12px;transition:border-color 0.15s}
.add-task-inp:focus{border-color:var(--pink-mid)}
.add-task-btns{display:flex;gap:8px}
.add-task-btn{flex:1;height:44px;border-radius:var(--radius-sm);border:none;font-family:'Baloo 2',cursive;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.12s}
.add-task-btn:active{transform:scale(0.97)}
.add-task-btn.cancel{background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.add-task-btn.confirm{background:var(--pink);color:#fff}

.fab-gray{background:#9ca3af}
</style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<div class="toast-el" id="toastEl"><span id="toastIcon">⭐</span><div><div id="toastTitle" style="font-family:Baloo 2,cursive;font-weight:700;font-size:13px;color:var(--pink)"></div><div id="toastSub" style="font-size:11px;color:#6b7280;margin-top:1px"></div></div></div>



<!-- Theme drawer -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="theme-drawer" id="themeDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title">🎨 테마 &amp; 프로필</div>
  <div class="theme-grid" id="themeGrid"></div>
  <div class="drawer-title2">이름 &amp; 프로필 사진</div>
  <div class="profile-edit-row">
    <div class="profile-upload" onclick="document.getElementById('profileFileInput').click()">📷</div>
    <input type="file" id="profileFileInput" accept="image/*" onchange="handleProfileImg(event)">
    <input class="profile-name-inp" id="profileNameInp" placeholder="이름 입력...">
    <button class="save-profile-btn" onclick="saveProfile()">저장</button>
  </div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="title-area" onclick="openDrawer()">
      <div class="profile-avatar" id="profileAvatar">🌸</div>
      <div class="app-title" id="appTitle">To do list for Ella ♥</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="editBtn" onclick="toggleEdit()" style="display:none">✏️</button>
      <div class="mode-tabs">
        <button class="mode-tab active" id="tabWeek" onclick="setMode('week')">주간</button>
        <button class="mode-tab" id="tabMonth" onclick="setMode('month')">월간</button>
      </div>
    </div>
  </div>
  <div class="nav-row" id="navRow">
    <button class="nav-btn" onclick="navPrev()">‹</button>
    <span class="nav-label" id="navLabel"></span>
    <button class="nav-btn" onclick="navNext()">›</button>
  </div>
</div>

<div id="editBanner" class="edit-banner"><span style="font-size:15px">✏️</span><span class="edit-banner-txt">✕ 버튼을 눌러 일정을 개별 삭제할 수 있어요</span></div>
<div id="weekBanner" class="week-banner"><div class="banner-text">🎊 이번 주 모두 완료! 폭죽 발사! 🎉</div></div>
<div class="prog-wrap"><span class="prog-label" id="progLabel">이번 주 달성률</span><div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div><span class="prog-pct" id="progPct">0%</span></div>

<div id="weekView" class="week-wrap"></div>
<div id="monthView" class="month-wrap" style="display:none"></div>

<!-- Add panels -->
<div class="panels" id="addPanels">
  <div class="panel">

// ── AUDIO ──
function getACtx(){
  if(!_audioCtx||_audioCtx.state==='closed') _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==='suspended') _audioCtx.resume();
  return _audioCtx;
}
function playTone(freq,dur,type,vol){
  type=type||'sine';vol=vol||0.14;
  if(!sfxEnabled)return;
  try{
    var ctx=getACtx(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.start(ctx.currentTime);o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function sfxCheck(){playTone(880,0.09);setTimeout(function(){playTone(1100,0.08);},65);}
function sfxUncheck(){playTone(440,0.08,'sine',0.08);}

  document.querySelectorAll('.theme-swatch').forEach(function(s){s.classList.toggle('active',s.dataset.id===id);});

// ── UTILS ──
function getMonday(d){var dt=new Date(d),day=dt.getDay();dt.setDate(dt.getDate()+(day===0?-6:1-day));dt.setHours(0,0,0,0);return dt;}
var weekStart=getMonday(new Date());
var calMonth=new Date();calMonth.setDate(1);calMonth.setHours(0,0,0,0);
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmt(d){return(d.getMonth()+1)+'/'+d.getDate();}
function getTasksForDate(dt){
  var dow=(dt.getDay()+6)%7,isoStr=iso(dt);
  var r=recurring
    .filter(function(t){
      if(!t.days.includes(dow)) return false;
      if(t.startDate && isoStr<t.startDate) return false;
      // 해당 날짜가 skip 목록에 있으면 제외
      var skips=recurringSkips[t.name]||[];
      if(skips.includes(isoStr)) return false;
      return true;
    })
    .map(function(t){return {name:t.name,id:'r:'+t.name,rname:t.name,recurring:true};});
  var o=oneoffs
    .filter(function(t){return t.date===isoStr;})
    .map(function(t){return {name:t.name,id:'o:'+t.oid,recurring:false,oid:t.oid};});
  return r.concat(o);
}
function ck(isoStr,taskId){return isoStr+'|'+taskId;}

}

// ── WEEK VIEW ──
function renderWeek(){
  var today=new Date();today.setHours(0,0,0,0);
  var sun=new Date(weekStart);sun.setDate(sun.getDate()+6);
  document.getElementById('navLabel').textContent=weekStart.getFullYear()+'년 '+fmt(weekStart)+' ~ '+fmt(sun);
  var dayData=[],maxTasks=0;
  for(var d=0;d<7;d++){
    var dt=new Date(weekStart);dt.setDate(dt.getDate()+d);
    var tasks=getTasksForDate(dt);
    dayData.push({dt:dt,tasks:tasks,isoStr:iso(dt)});
    if(tasks.length>maxTasks)maxTasks=tasks.length;
  }
  var container=document.getElementById('weekView');container.innerHTML='';
  // Day headers
  var hdrs=document.createElement('div');hdrs.className='day-headers';
  dayData.forEach(function(dd,d){
    var isToday=dd.dt.getTime()===today.getTime();
    var dh=document.createElement('div');
    dh.className='dh'+(d===5?' sat':d===6?' sun':'')+(isToday?' today':'');
    dh.innerHTML='<div class="dn">'+DAY_KR[d]+'</div><div class="dd">'+fmt(dd.dt)+'</div>';
    hdrs.appendChild(dh);
  });
  container.appendChild(hdrs);
  // Task rows
  for(var row=0;row<maxTasks;row++){
    var rowEl=document.createElement('div');rowEl.className='task-row-line';
    dayData.forEach(function(dd,d){
      var t=dd.tasks[row];
      var cell=document.createElement('div');
      if(!t){cell.className='task-cell empty';}
      else{
        var k=ck(dd.isoStr,t.id);
        var done=!!checks[k];
        cell.className='task-cell'+(done?' checked':'');
        // Build cell content
        var chkDiv=document.createElement('div');chkDiv.className='cell-check';
        chkDiv.innerHTML='<div class="check-mark"></div>';
        var nameDiv=document.createElement('div');nameDiv.className='cell-name';nameDiv.textContent=t.name;
        cell.appendChild(chkDiv);cell.appendChild(nameDiv);
        // X delete button (shown in edit mode)
        if(editMode){
          var xBtn=document.createElement('button');
          xBtn.style.cssText='position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#DC2626;border:none;color:#fff;font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;z-index:2';
          xBtn.textContent='✕';
          (function(taskObj,isoStr2){
            xBtn.onclick=function(e){
              e.stopPropagation();
              if(taskObj.recurring){
                // 이 날짜만 skip 추가 — 다음 주는 그대로 유지
                if(!recurringSkips[taskObj.rname]) recurringSkips[taskObj.rname]=[];
                if(!recurringSkips[taskObj.rname].includes(isoStr2)){
                  recurringSkips[taskObj.rname].push(isoStr2);
                }
              } else {
                oneoffs=oneoffs.filter(function(o){return o.oid!==taskObj.oid;});
              }
              delete checks[ck(isoStr2,taskObj.id)];
              save();render();
              if(editMode)renderManageLists();
            };
          })(t,dd.isoStr);
          cell.appendChild(xBtn);
        }
        // Click handler (check/uncheck) — only when not in edit mode
        (function(taskObj,isoStr,dayIdx,tasks){
          cell.onclick=function(e){
            if(editMode)return;
            var k2=ck(isoStr,taskObj.id);
            checks[k2]=!checks[k2];
            if(checks[k2]){sfxCheck();}else{sfxUncheck();}
            save();checkBadges();
            if(checks[k2]){
              var allDone=tasks.length>0&&tasks.every(function(tx){return !!checks[ck(isoStr,tx.id)];});
              if(allDone){
                var dayKey=isoStr;
                if(!_dayPopupShown[dayKey]){
                  _dayPopupShown[dayKey]=true;
                  setTimeout(function(){showDayCompletePopup(dayIdx,isoStr);},300);
                }
              }
            }
            render();
          };
        })(t,dd.isoStr,d,dd.tasks);
      }
      rowEl.appendChild(cell);
    });
    container.appendChild(rowEl);
  }
  // Sticker row
  var stkRow=document.createElement('div');stkRow.className='sticker-row';
  dayData.forEach(function(dd,d){
    var doneCnt=dd.tasks.filter(function(t){return !!checks[ck(dd.isoStr,t.id)];}).length;
    var allDone=dd.tasks.length>0&&doneCnt===dd.tasks.length;
    var cell=document.createElement('div');cell.className='sticker-cell'+(allDone?' earned':'');
    if(allDone){
      if(d===1){cell.innerHTML='<div class="s-bunny">'+getBunnySVG(32)+'</div><div class="s-txt">Get a<br>Sticker!</div>';}
      else{cell.innerHTML='<div class="s-icon">'+['⭐','🐰','🏆','🎀','💖','🌈','🦄'][d]+'</div><div class="s-txt">Get a<br>Sticker!</div>';}
    }else{cell.innerHTML='<div class="s-dot"></div>';}
    stkRow.appendChild(cell);
  });
  container.appendChild(stkRow);

  // + 버튼 행 (각 요일 하단)
  var plusRow=document.createElement('div');plusRow.className='task-row-line';
  dayData.forEach(function(dd,d){
    var btn=document.createElement('button');
    btn.className='day-add-btn';
    btn.textContent='+';
    btn.setAttribute('title',DAY_KR[d]+'요일 일정 추가');
    (function(isoDate,dayLabel){
      btn.onclick=function(){openAddTask(isoDate,dayLabel);};
    })(dd.isoStr, DAY_KR[d]+'요일 ('+fmt(dd.dt)+')');
    plusRow.appendChild(btn);
  });
  container.appendChild(plusRow);

  checkWeekComplete();
}

  launchConfetti();
  var song=FROZEN_OST_BY_DAY[dayIdx];
  var isAndroid=/android/i.test(navigator.userAgent);

  var href=isAndroid&&videoId
    ?'intent://music.youtube.com/watch?v='+videoId+'#Intent;scheme=https;package=com.google.android.apps.youtube.music;S.browser_fallback_url='+encodeURIComponent(song.url)+';end'
    :song.url;

  var iconEl=document.createElement('div');iconEl.style.cssText='font-size:50px;line-height:1;margin-bottom:10px';iconEl.textContent='🌟';
  box.appendChild(iconEl);
  // Title
  var titleEl=document.createElement('div');titleEl.style.cssText='font-family:Baloo 2,cursive;font-size:26px;font-weight:800;color:var(--pink);margin-bottom:5px';titleEl.textContent='잘했어요 ♥';
  box.appendChild(titleEl);
  // Sub
  var subEl=document.createElement('div');subEl.style.cssText='font-size:13px;color:var(--text2);margin-bottom:16px';subEl.textContent=DAY_KR[dayIdx]+'요일 할 일 모두 완료! Ella 최고 👑';
  box.appendChild(subEl);
  // Song name
  var songEl=document.createElement('div');songEl.style.cssText='font-size:12px;color:#8B5CF6;font-weight:700;margin-bottom:14px;font-family:Baloo 2,cursive';songEl.textContent='🎵 '+song.title;
  box.appendChild(songEl);
  // Music button
  var musicBtn=document.createElement('a');

  musicBtn.style.cssText='display:block;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--pink),#8B5CF6);color:#fff;font-family:Baloo 2,cursive;font-size:15px;font-weight:800;text-decoration:none;margin-bottom:10px';
  musicBtn.textContent='🎵 YouTube Music에서 듣기';
  musicBtn.addEventListener('click',function(){setTimeout(function(){overlay.remove();},500);});
  box.appendChild(musicBtn);
  // Close
  var closeBtn=document.createElement('button');
  closeBtn.style.cssText='width:100%;padding:10px;border-radius:12px;background:transparent;border:none;color:var(--text3);font-family:Baloo 2,cursive;font-size:12px;cursor:pointer';
  closeBtn.textContent='나중에 듣기';
  closeBtn.onclick=function(){overlay.remove();};
  box.appendChild(closeBtn);

  overlay.appendChild(box);
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
}

// ── MONTH VIEW (달력 + 통계) ──
function renderMonth(){
  var y=calMonth.getFullYear(),m=calMonth.getMonth();
  document.getElementById('navLabel').textContent=y+'년 '+(m+1)+'월';
  var container=document.getElementById('monthView');container.innerHTML='';
  // Calendar
  var calWrap=document.createElement('div');calWrap.style.marginBottom='10px';
  var grid=document.createElement('div');grid.className='cal-grid';
  ['월','화','수','목','금','토','일'].forEach(function(d,i){
    var el=document.createElement('div');el.className='cal-dow'+(i===5?' s':i===6?' u':'');el.textContent=d;grid.appendChild(el);
  });
  var firstDay=new Date(y,m,1);
  var startDow=(firstDay.getDay()+6)%7;
  var daysInMonth=new Date(y,m+1,0).getDate();
  var todayD=new Date();todayD.setHours(0,0,0,0);
  for(var i=0;i<startDow;i++) grid.appendChild(makeCalCell(new Date(y,m,1-startDow+i),true,todayD));
  for(var dd=1;dd<=daysInMonth;dd++) grid.appendChild(makeCalCell(new Date(y,m,dd),false,todayD));
  var rem=(7-((startDow+daysInMonth)%7))%7;
  for(var j=1;j<=rem;j++) grid.appendChild(makeCalCell(new Date(y,m+1,j),true,todayD));
  calWrap.appendChild(grid);container.appendChild(calWrap);
  // Stats
  renderStatsInto(container);
}
function makeCalCell(dt,other,today){
  var isoStr=iso(dt),dow=(dt.getDay()+6)%7,isToday=dt.getTime()===today.getTime();
  var tasks=getTasksForDate(dt);
  var doneCnt=tasks.filter(function(t){return !!checks[ck(isoStr,t.id)];}).length;
  var allDone=tasks.length>0&&doneCnt===tasks.length;
  var cell=document.createElement('div');
  cell.className='cal-cell'+(other?' other':'')+(isToday?' today-c':'')+(allDone?' earned-c':'');
  var num=document.createElement('div');num.className='cal-num'+(dow===5?' s':dow===6?' u':'')+(isToday?' today-n':'');
  num.textContent=dt.getDate();cell.appendChild(num);
  if(allDone){
    if(dow===1){var b=document.createElement('div');b.className='cal-bunny';b.innerHTML=getBunnySVG(22);cell.appendChild(b);}
    else{var si=document.createElement('div');si.className='cal-sticker';si.textContent=['⭐','🐰','🏆','🎀','💖','🌈','🦄'][dow];cell.appendChild(si);}
  }else if(tasks.length>0){
    var bw=document.createElement('div');bw.className='cal-bar-wrap';
    var bar=document.createElement('div');bar.className='cal-bar';
    var fill=document.createElement('div');fill.className='cal-bar-fill';fill.style.width=Math.round(doneCnt/tasks.length*100)+'%';
    bar.appendChild(fill);bw.appendChild(bar);
    var cnt=document.createElement('div');cnt.className='cal-cnt';cnt.textContent=doneCnt+'/'+tasks.length;bw.appendChild(cnt);cell.appendChild(bw);
  }
  return cell;
}
function renderStatsInto(container){
  // Level card
  var totalDone=0;Object.values(checks).forEach(function(v){if(v)totalDone++;});
  var levels=[
    {name:'씨앗 🌱',min:0,max:10},{name:'새싹 🌿',min:10,max:30},
    {name:'꽃봉오리 🌸',min:30,max:60},{name:'꽃 🌺',min:60,max:100},
    {name:'나무 🌳',min:100,max:200},{name:'스타 ⭐',min:200,max:Infinity},
  ];
  var lv=levels.find(function(l){return totalDone>=l.min&&totalDone<l.max;})||levels[levels.length-1];
  var lvPct=lv.max===Infinity?100:Math.round((totalDone-lv.min)/(lv.max-lv.min)*100);
  var lvCard=document.createElement('div');lvCard.className='stats-section';
  lvCard.innerHTML='<div class="stats-title">🏅 현재 레벨</div>'
    +'<div class="level-card"><div class="level-icon">'+lv.name.slice(-2)+'</div><div class="level-info">'
    +'<div class="level-name">'+lv.name+'</div>'
    +'<div class="level-sub">총 '+totalDone+'개 완료 · '+(lv.max===Infinity?'최고 레벨!':lv.max-totalDone+'개 더!')+'</div>'
    +'<div class="level-prog"><div class="level-prog-fill" style="width:'+lvPct+'%"></div></div>'
    +'</div></div>';
  container.appendChild(lvCard);
  // Monthly chart
  var cs=document.createElement('div');cs.className='stats-section';cs.innerHTML='<div class="stats-title">📊 월별 달성률</div>';
  var ce=document.createElement('div');ce.className='month-chart';
  var now=new Date();
  for(var i=5;i>=0;i--){
    var d2=new Date(now.getFullYear(),now.getMonth()-i,1);
    var y2=d2.getFullYear(),m2=d2.getMonth(),days=new Date(y2,m2+1,0).getDate();
    var tot=0,done=0;
    for(var dd2=1;dd2<=days;dd2++){var dt2=new Date(y2,m2,dd2);getTasksForDate(dt2).forEach(function(t){tot++;if(checks[ck(iso(dt2),t.id)])done++;});}
    var pct=tot>0?Math.round(done/tot*100):0;
    var bw2=document.createElement('div');bw2.className='month-bar-wrap';
    bw2.innerHTML='<div class="month-bar-bg"><div class="month-bar-fill" style="height:'+pct+'%"></div></div><div class="month-bar-lbl">'+(m2+1)+'월</div>';
    ce.appendChild(bw2);
  }
  cs.appendChild(ce);container.appendChild(cs);
  // Task stats
  var ts=document.createElement('div');ts.className='stats-section';ts.innerHTML='<div class="stats-title">📋 항목별 달성률 (최근 4주)</div>';
  var taskStats={};
  recurring.forEach(function(t){
    var tot2=0,done2=0;
    for(var w=0;w<4;w++){
      var base=getMonday(new Date());base.setDate(base.getDate()-w*7);
      t.days.forEach(function(dw){
        var dt3=new Date(base);dt3.setDate(dt3.getDate()+dw);
        var k=ck(iso(dt3),'r:'+t.name);tot2++;if(checks[k])done2++;
      });
    }
    taskStats[t.name]={tot:tot2,done:done2};
  });
  Object.entries(taskStats).sort(function(a,b){return (b[1].done/b[1].tot||0)-(a[1].done/a[1].tot||0);}).forEach(function(entry){
    var name=entry[0],tot3=entry[1].tot,done3=entry[1].done;
    var pct2=tot3>0?Math.round(done3/tot3*100):0;
    var row=document.createElement('div');row.className='stat-row';
    row.innerHTML='<div class="stat-label">'+name+'</div><div class="stat-bar-wrap"><div class="stat-bar"><div class="stat-bar-fill" style="width:'+pct2+'%"></div></div></div><div class="stat-pct">'+pct2+'%</div>';
    ts.appendChild(row);
  });
  container.appendChild(ts);
  // Badges
  var bs=document.createElement('div');bs.className='stats-section';bs.innerHTML='<div class="stats-title">🎖️ 배지 컬렉션</div>';
  var bg=document.createElement('div');bg.className='badge-grid';
  BADGES.forEach(function(b){
    var u=badges.includes(b.id);
    var item=document.createElement('div');item.className='badge-item'+(u?' unlocked':'');
    item.innerHTML='<div class="badge-icon">'+(u?b.icon:'🔒')+'</div><div class="badge-name">'+b.name+'</div><div class="badge-lock">'+(u?'획득!':b.desc)+'</div>';
    bg.appendChild(item);
  });
  bs.appendChild(bg);container.appendChild(bs);
}

// ── MANAGE LISTS (edit mode) ──
function renderManageLists(){
  renderRecurringList();
  renderOneoffList();
}

// ── RECURRING LIST (no drag) ──
function renderRecurringList(){
  var list=document.getElementById('recurringList');
  if(!list)return;
  list.innerHTML='';
  if(!recurring.length){
    list.innerHTML='<div style="font-size:12px;color:var(--text3);padding:6px 0">반복 일정이 없어요</div>';return;
  }
  recurring.forEach(function(task,idx){
    var row=document.createElement('div');
    row.className='edit-row';
    row.innerHTML='<div class="edit-row-name">'+task.name+'</div>'
      +'<div class="edit-row-sub">'+task.days.map(function(d){return DAY_KR[d];}).join(' ')+'</div>'
      +'<button class="edit-del">✕</button>';
    row.querySelector('.edit-del').onclick=function(e){
      e.stopPropagation();
      if(confirm('"'+task.name+'" 반복 일정을 삭제할까요? 모든 요일에서 삭제됩니다.')){
        recurring.splice(idx,1);
        save();render();renderManageLists();
      }
    };
    list.appendChild(row);
  });
}

// ── ONEOFF LIST (individual delete) ──
function renderOneoffList(){
  var list=document.getElementById('oneoffList');
  if(!list)return;
  list.innerHTML='';
  var sorted=oneoffs.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  if(!sorted.length){
    list.innerHTML='<div style="font-size:12px;color:var(--text3);padding:6px 0">개별 일정이 없어요</div>';return;
  }
  sorted.forEach(function(task){
    var row=document.createElement('div');row.className='edit-row';
    var d=new Date(task.date+'T00:00:00');
    var dateStr=(d.getMonth()+1)+'/'+d.getDate()+' ('+DAY_KR[(d.getDay()+6)%7]+')';
    row.innerHTML='<div class="edit-row-name">'+task.name+'</div>'
      +'<div class="edit-row-sub">'+dateStr+'</div>'
      +'<button class="edit-del">✕</button>';
    // Delete: only this specific oneoff entry by oid
    (function(oid){
      row.querySelector('.edit-del').onclick=function(e){
        e.stopPropagation();
        oneoffs=oneoffs.filter(function(o){return o.oid!==oid;});
        save();render();renderManageLists();
      };
    })(task.oid);
    list.appendChild(row);
  });
}

// ── BADGES ──
function checkBadges(){
  var today=new Date();today.setHours(0,0,0,0);
  var isoToday=iso(today);
  var todayTasks=getTasksForDate(today);
  var todayDone=todayTasks.length>0&&todayTasks.every(function(t){return !!checks[ck(isoToday,t.id)];});
  if(todayDone&&!badges.includes('first')){badges.push('first');save();showBadgeToast(BADGES.find(function(b){return b.id==='first';}));}
  if(todayDone&&new Date().getHours()<19&&!badges.includes('evening')){badges.push('evening');save();showBadgeToast(BADGES.find(function(b){return b.id==='evening';}));}
  var streak=0;
  for(var i=0;i<30;i++){var dt=new Date(today);dt.setDate(dt.getDate()-i);var tasks=getTasksForDate(dt);var isoS=iso(dt);if(tasks.length>0&&tasks.every(function(t){return !!checks[ck(isoS,t.id)];}))streak++;else break;}
  if(streak>=3&&!badges.includes('streak3')){badges.push('streak3');save();showBadgeToast(BADGES.find(function(b){return b.id==='streak3';}));}
  if(streak>=7&&!badges.includes('streak7')){badges.push('streak7');save();showBadgeToast(BADGES.find(function(b){return b.id==='streak7';}));}
  save();
}
function showBadgeToast(b){
  if(!b)return;
  showToast(b.icon,'배지 획득!',b.name);
}

// ── PROGRESS ──
function updateProgress(){
  var tot=0,done=0;
  if(mode==='week'){
    for(var d=0;d<7;d++){var dt=new Date(weekStart);dt.setDate(dt.getDate()+d);getTasksForDate(dt).forEach(function(t){tot++;if(checks[ck(iso(dt),t.id)])done++;});}
  }else{
    var y=calMonth.getFullYear(),m=calMonth.getMonth(),days=new Date(y,m+1,0).getDate();
    for(var dd=1;dd<=days;dd++){var dt2=new Date(y,m,dd);getTasksForDate(dt2).forEach(function(t){tot++;if(checks[ck(iso(dt2),t.id)])done++;});}
  }
  var pct=tot>0?Math.round(done/tot*100):0;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progPct').textContent=pct+'%';
}

// ── WEEK COMPLETE ──
function checkWeekComplete(){
  var tot=0,done=0;
  for(var d=0;d<7;d++){var dt=new Date(weekStart);dt.setDate(dt.getDate()+d);getTasksForDate(dt).forEach(function(t){tot++;if(checks[ck(iso(dt),t.id)])done++;});}
  if(tot>0&&done===tot&&!weekBannerShown){
    weekBannerShown=true;
    document.getElementById('weekBanner').classList.add('show');
    launchConfetti();sfxWeekDone();
    if(!badges.includes('week1')){badges.push('week1');save();showBadgeToast(BADGES.find(function(b){return b.id==='week1';}));}
  }else if(done<tot){weekBannerShown=false;document.getElementById('weekBanner').classList.remove('show');}
}

// ── ADD/DELETE ──
function addRecurring(){
  var name=document.getElementById('rName').value.trim();if(!name)return;
  var days=[...document.querySelectorAll('#rPills .dpill.sel')].map(function(p){return +p.dataset.i;});
  if(!days.length){alert('요일을 선택해주세요!');return;}
  // startDate = this Monday (so previous weeks are unaffected)
  var thisMonday=getMonday(new Date());
  var startDate=iso(thisMonday);
  var existing=recurring.find(function(r){return r.name===name;});
  if(existing){
    var merged=[...new Set(existing.days.concat(days))].sort(function(a,b){return a-b;});
    existing.days=merged;
    showToast('✅',name+' 요일 추가!','이번 주부터 반영돼요');
  }else{
    recurring.push({name:name,days:days,startDate:startDate});
  }
  document.getElementById('rName').value='';
  document.querySelectorAll('#rPills .dpill.sel').forEach(function(p){p.classList.remove('sel');});
  save();render();
  if(editMode)renderManageLists();
}

// ── CONFETTI ──
function launchConfetti(){
  var canvas=document.getElementById('confettiCanvas');
  var ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  var colors=['#E8437A','#FFB6C1','#93c5fd','#6ee7b7','#c4b5fd','#fde68a','#fdba74','#a5f3fc'];
  var pieces=Array.from({length:130},function(){return {x:Math.random()*canvas.width,y:-20,vx:(Math.random()-0.5)*6,vy:Math.random()*5+3,color:colors[Math.floor(Math.random()*colors.length)],w:Math.random()*10+5,h:Math.random()*6+3,rot:Math.random()*360,vr:(Math.random()-0.5)*14,alpha:1};});
  var frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.alpha-=0.005;if(p.alpha<=0)return;ctx.save();ctx.globalAlpha=p.alpha;ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    frame++;if(frame<180)requestAnimationFrame(draw);else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}


// ── PER-DAY ADD TASK ──
var _addTaskDate='';
function openAddTask(isoDate, label){
  _addTaskDate=isoDate;
  document.getElementById('addTaskTitle').textContent=label+' 일정 추가';
  document.getElementById('addTaskSub').textContent=label+'의 개별 일정을 추가해요';
  document.getElementById('addTaskInp').value='';
  document.getElementById('addTaskOverlay').classList.add('show');
  setTimeout(function(){document.getElementById('addTaskInp').focus();},100);
}
function closeAddTask(){
  document.getElementById('addTaskOverlay').classList.remove('show');
  _addTaskDate='';
}
function confirmAddTask(){
  var name=document.getElementById('addTaskInp').value.trim();
  if(!name){document.getElementById('addTaskInp').focus();return;}
  if(!_addTaskDate)return;
  var oid=Date.now()+'';
  oneoffs.unshift({name:name,date:_addTaskDate,oid:oid});
  save();closeAddTask();render();
}
